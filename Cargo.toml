[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
argon2 = "0.6"
chacha20poly1305 = "0.11"
secrecy = "0.10"
zeroize = "1"
iced = { version = "0.14", features = ["tokio", "canvas", "advanced"] }
anyhow = "1"
directories = "6"
serde_json = "1"
nucleo-matcher = "0.3"
russh = "0.65"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
bytes = "1"
base64 = "0.22"

tern-core = { path = "crates/tern-core" }
tern-vault = { path = "crates/tern-vault" }
tern-store = { path = "crates/tern-store" }
tern-ssh = { path = "crates/tern-ssh" }
tern-term = { path = "crates/tern-term" }
tern-io = { path = "crates/tern-io" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# Argon2 is unusably slow at opt-level 0; keep crypto optimised even in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

# RSA key generation is unusably slow unoptimised.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
